<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBlog | Create Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>
            <h2>MyBlog</h2>

            <div>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="create-blog.html">Create Blog</a>
                <a href="login.html">Logout</a>
            </div>
        </nav>
    </header>


    <!-- Create Blog -->
    <main>

        <section class="create-blog-section">

            <div class="create-blog-box">

                <h1>Create New Blog</h1>

                <p>Share your thoughts with the world.</p>


                <form id="blogForm">

                    <!-- Blog Title -->
                    <div class="form-group">

                        <label for="blogTitle">
                            Blog Title
                        </label>

                        <input
                            type="text"
                            id="blogTitle"
                            placeholder="Enter your blog title"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>

                            <option value="">
                                Select a category
                            </option>

                            <option value="technology">
                                Technology
                            </option>

                            <option value="programming">
                                Programming
                            </option>

                            <option value="education">
                                Education
                            </option>

                            <option value="lifestyle">
                                Lifestyle
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Blog Content -->
                    <div class="form-group">

                        <label for="blogContent">
                            Blog Content
                        </label>

                        <textarea
                            id="blogContent"
                            rows="10"
                            placeholder="Write your blog here..."
                            required
                        ></textarea>

                    </div>


                    <!-- Buttons -->
                    <div class="blog-buttons">

                        <a href="dashboard.html"
                           class="cancel-btn">
                            Cancel
                        </a>

                        <button type="submit">
                            Publish Blog
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MyBlog. All Rights Reserved.
        </p>

    </footer>


    <script src="javascript/script.js"></script>

</body>

</html>
